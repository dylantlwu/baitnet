<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d">
  <title id="t">BaitNet 整体流程</title>
  <desc id="d">骗子 AI 和诱饵 AI 对话，系统抽出收款地址，人工复核后写进 NEAR 警报登记表，钱包守卫和 Intents 做市商据此拦截付款。</desc>
  <style>
    .bg{fill:#fbfaf7;stroke:#d9d4ca}
    .t{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1f2328}
    .s{font-size:13px;fill:#57606a}
    .h{font-size:16px;font-weight:600}
    .n{font-size:13px;font-weight:700;fill:#fff}
    .box{fill:#ffffff;stroke:#8c959f;stroke-width:1.5}
    .red{fill:#fdecea;stroke:#c9372c;stroke-width:1.5}
    .blue{fill:#e8f1fd;stroke:#2f6fd0;stroke-width:1.5}
    .amber{fill:#fff4dc;stroke:#c98a0b;stroke-width:1.5}
    .green{fill:#e7f6ec;stroke:#1f8a4c;stroke-width:1.5}
    .gray{fill:#f2f2f2;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:4 3}
    .ln{stroke:#57606a;stroke-width:2;fill:none}
    .ln2{stroke:#c9372c;stroke-width:2;fill:none}
    .dot{fill:#d4522a}
    .ah{fill:#57606a}
    .ahr{fill:#c9372c}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1c1f24;stroke:#3b424c}
      .t{fill:#e6edf3}
      .s{fill:#a8b3bd}
      .box{fill:#262b32;stroke:#8b949e}
      .red{fill:#3a1f1d;stroke:#f47067}
      .blue{fill:#18273d;stroke:#6aa5f5}
      .amber{fill:#3a2e14;stroke:#e0a73a}
      .green{fill:#16301f;stroke:#57c785}
      .gray{fill:#24282e;stroke:#8b949e}
      .ln{stroke:#a8b3bd}
      .ah{fill:#a8b3bd}
      .ln2{stroke:#f47067}
      .ahr{fill:#f47067}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ahr" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="1" y="1" width="978" height="468" rx="14"/>
  <text class="t h" x="24" y="34">BaitNet 整体流程：从一段诈骗对话，到一笔被拦下的付款</text>

  <!-- step 1: conversation -->
  <rect class="red" x="24" y="70" width="170" height="78" rx="10"/>
  <text class="t h" x="109" y="100" text-anchor="middle">骗子 AI</text>
  <text class="t s" x="109" y="124" text-anchor="middle">按剧本出招、给收款地址</text>
  <rect class="blue" x="24" y="196" width="170" height="78" rx="10"/>
  <text class="t h" x="109" y="226" text-anchor="middle">诱饵 AI</text>
  <text class="t s" x="109" y="250" text-anchor="middle">扮受害者，追问"转哪里"</text>
  <path class="ln" d="M84 150 V194" marker-end="url(#a)"/>
  <path class="ln" d="M134 194 V150" marker-end="url(#a)"/>
  <text class="t s" x="109" y="176" text-anchor="middle">对话</text>

  <!-- human -->
  <rect class="gray" x="24" y="318" width="170" height="74" rx="10"/>
  <text class="t h" x="109" y="346" text-anchor="middle">真人（你）</text>
  <text class="t s" x="109" y="370" text-anchor="middle">可接管任一方，或耳语</text>
  <path class="ln" d="M109 316 V278" marker-end="url(#a)" stroke-dasharray="5 4"/>

  <!-- step 2: extract -->
  <rect class="box" x="246" y="150" width="150" height="78" rx="10"/>
  <text class="t h" x="321" y="180" text-anchor="middle">自动抽取</text>
  <text class="t s" x="321" y="204" text-anchor="middle">地址 / 链 / 网址</text>
  <path class="ln" d="M196 110 Q226 110 236 160 L244 175" marker-end="url(#a)"/>

  <!-- poison filter -->
  <rect class="gray" x="246" y="270" width="150" height="74" rx="10"/>
  <text class="t h" x="321" y="298" text-anchor="middle">防投毒过滤</text>
  <text class="t s" x="321" y="322" text-anchor="middle">交易所/桥合约不上链</text>
  <path class="ln" d="M321 230 V268" marker-end="url(#a)" stroke-dasharray="5 4"/>

  <!-- step 3: review -->
  <rect class="amber" x="448" y="150" width="150" height="78" rx="10"/>
  <text class="t h" x="523" y="180" text-anchor="middle">人工复核</text>
  <text class="t s" x="523" y="204" text-anchor="middle">通过 或 驳回</text>
  <path class="ln" d="M398 189 H446" marker-end="url(#a)"/>

  <!-- step 4: on chain -->
  <rect class="green" x="650" y="140" width="160" height="98" rx="10"/>
  <text class="t h" x="730" y="172" text-anchor="middle">上链</text>
  <text class="t s" x="730" y="196" text-anchor="middle">NEAR 警报登记表</text>
  <text class="t s" x="730" y="218" text-anchor="middle">公开可查、不能改</text>
  <path class="ln" d="M600 189 H648" marker-end="url(#a)"/>
  <text class="t s" x="624" y="180" text-anchor="middle">通过</text>

  <!-- step 5: consumers -->
  <rect class="box" x="650" y="292" width="150" height="66" rx="10"/>
  <text class="t h" x="725" y="320" text-anchor="middle">钱包守卫</text>
  <text class="t s" x="725" y="342" text-anchor="middle">AI 付款前先查</text>
  <rect class="box" x="814" y="292" width="146" height="66" rx="10"/>
  <text class="t h" x="887" y="320" text-anchor="middle">Intents 做市商</text>
  <text class="t s" x="887" y="342" text-anchor="middle">换币报价前先查</text>
  <path class="ln" d="M715 240 V290" marker-end="url(#a)"/>
  <path class="ln" d="M790 240 Q860 250 875 290" marker-end="url(#a)"/>
  <text class="t s" x="826" y="262">查询</text>

  <!-- step 6: blocked -->
  <rect class="red" x="650" y="390" width="310" height="56" rx="10"/>
  <text class="t h" x="805" y="424" text-anchor="middle">往骗子地址的付款 / 换币被拦下</text>
  <path class="ln2" d="M725 360 V388" marker-end="url(#ar)"/>
  <path class="ln2" d="M887 360 V388" marker-end="url(#ar)"/>

  <!-- step numbers -->
  <circle class="dot" cx="38" cy="70" r="13"/><text class="t n" x="38" y="75" text-anchor="middle">1</text>
  <circle class="dot" cx="246" cy="150" r="13"/><text class="t n" x="246" y="155" text-anchor="middle">2</text>
  <circle class="dot" cx="448" cy="150" r="13"/><text class="t n" x="448" y="155" text-anchor="middle">3</text>
  <circle class="dot" cx="650" cy="140" r="13"/><text class="t n" x="650" y="145" text-anchor="middle">4</text>
  <circle class="dot" cx="650" cy="292" r="13"/><text class="t n" x="650" y="297" text-anchor="middle">5</text>
  <circle class="dot" cx="650" cy="390" r="13"/><text class="t n" x="650" y="395" text-anchor="middle">6</text>

  <text class="t s" x="448" y="290">驳回 → 不上链，只留记录</text>
  <path class="ln" d="M523 230 V270" stroke-dasharray="5 4"/>
</svg>
